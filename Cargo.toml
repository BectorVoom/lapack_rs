[package]
name = "lapack_rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "Divide-and-conquer symmetric/Hermitian eigensolver transcribed bit for bit from Reference-LAPACK 3.12.1, running on CubeCL (CPU runtime, ROCm or CUDA)"
readme = "README.md"
keywords = ["lapack", "eigenvalues", "linear-algebra", "cubecl"]
categories = ["science", "mathematics"]
include = ["/src", "/build.rs", "/cubecl.toml", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[features]
# The CubeCL CPU runtime is the default backend: there is one kernel set and
# no host parallel path (rayon is gone). `cpu`, `rocm` and `cuda` select the
# *runtime*; the kernels and the bits they produce are the same.
default = ["cpu"]
# CubeCL CPU runtime (f64). The default backend, and where the f64 kernels are
# validated when no f64 GPU is available.
cpu = ["cubecl/cpu"]
rocm = ["dep:cubecl-hip"]
# NVIDIA backend (f64-capable). Kernels are compiled by NVRTC, which contracts
# into FMA unless `NVRTC_COMPILE_OPTIONS_APPEND=--fmad=false` (patched crate,
# see crates/cubecl-cuda/PATCHED.md).
cuda = ["dep:cubecl-cuda"]
# Branch counters for the D&C deflation fixtures.
stats = []

[dependencies]
# Exact pins keep one cubecl stack (FOUND-04, check-cubecl-pin).
cubecl = "=0.10.0"
cubecl-runtime = "=0.10.0"
bytemuck = "1"
cubecl-hip = { version = "=0.10.0", optional = true }
cubecl-cuda = { version = "=0.10.0", optional = true }

[dev-dependencies]
# Independent reference (tolerance and speed/memory baseline), never a
# production dependency.
faer = "0.24.0"
cint_ref = { path = "crates/cint_ref" }
lapack_ref = { path = "crates/lapack_ref" }
openblas_ref = { path = "crates/openblas_ref" }
rayon = "1.12"

[[example]]
name = "phases"

[[example]]
name = "kernels"

[workspace]
resolver = "3"
members = [".", "crates/cint_ref", "crates/lapack_ref", "crates/openblas_ref", "xtask"]
exclude = ["crates/cubecl-cuda", "crates/cubecl-opt"]

# cubecl-cuda 0.10.0 with an NVRTC options hook (FMA contraction off).
[patch.crates-io]
cubecl-cuda = { path = "crates/cubecl-cuda" }
cubecl-opt = { path = "crates/cubecl-opt" }

[profile.dev]
debug = 0
codegen-units = 16
incremental = false

[profile.dev.build-override]
opt-level = 3
codegen-units = 2
debug = false

[profile.test]
debug = 0
opt-level = 1

[profile.release]
debug = 0
incremental = false
codegen-units = 16

[[example]]
name = "device_memory"
required-features = ["cpu"]

[[example]]
name = "device_profile"

[[example]]
name = "device_kernel_bench"
